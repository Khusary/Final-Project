<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("securecrypt_theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}if(t==="light")document.documentElement.setAttribute("data-theme","light");})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page Not Found | SecureCrypt</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  .not-found { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  .not-found h1 { font-size: 100px; font-weight: 800; background: linear-gradient(135deg, var(--blue-light), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; }
  .not-found p { color: var(--text-secondary); margin: 16px 0 28px; font-size: 15px; }
</style>
</head>
<body>
  <div class="not-found">
    <h1>404</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="../index.html" class="btn btn-primary">Back to Home</a>
  </div>
</body>
</html>
