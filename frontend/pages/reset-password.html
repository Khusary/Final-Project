<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("securecrypt_theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}if(t==="light")document.documentElement.setAttribute("data-theme","light");})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — SecureCrypt</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
<div class="auth-bg-glow"></div>
<button class="theme-toggle-btn" type="button" style="position:fixed;top:20px;right:20px;z-index:10;">☀️</button>
<div class="auth-wrapper">
  <div class="glass-panel auth-card text-center">
    <a href="../index.html" class="brand mb-24" style="display:inline-flex;"><img class="brand-icon" src="../images/logo.png" alt="SecureCrypt logo" /> SecureCrypt</a>
    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-subtitle">Enter the code sent to <strong id="reset-email-display" style="color:var(--text-primary);"></strong></p>

    <form id="reset-password-form">
      <div class="otp-inputs">
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
      </div>
      <div class="form-group text-left mt-16">
        <label class="form-label" for="new-password">New Password</label>
        <input class="form-input" type="password" id="new-password" placeholder="At least 8 characters" required minlength="8" />
      </div>
      <div class="form-group text-left">
        <label class="form-label" for="confirm-password">Confirm New Password</label>
        <input class="form-input" type="password" id="confirm-password" placeholder="Repeat password" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
    </form>

    <p class="auth-footer"><a href="login.html">← Back to login</a></p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/notification.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
