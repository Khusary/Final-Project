<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("securecrypt_theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}if(t==="light")document.documentElement.setAttribute("data-theme","light");})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — SecureCrypt</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
<div class="auth-bg-glow"></div>
<button class="theme-toggle-btn" type="button" style="position:fixed;top:20px;right:20px;z-index:10;">☀️</button>
<div class="auth-wrapper">
  <div class="glass-panel auth-card">
    <a href="../index.html" class="brand mb-24" style="display:inline-flex;"><img class="brand-icon" src="../images/logo.png" alt="SecureCrypt logo" /> SecureCrypt</a>
    <h1 class="auth-title">Forgot your password?</h1>
    <p class="auth-subtitle">Enter your email and we'll send you a reset code.</p>

    <form id="forgot-password-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Reset Code</button>
    </form>

    <p class="auth-footer"><a href="login.html">← Back to login</a></p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/notification.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
