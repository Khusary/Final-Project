<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("securecrypt_theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}if(t==="light")document.documentElement.setAttribute("data-theme","light");})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upload — SecureCrypt</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar glass-panel">
    <a href="../index.html" class="brand"><img class="brand-icon" src="../images/logo.png" alt="SecureCrypt logo" /> SecureCrypt</a>
    <nav>
      <a href="dashboard.html" class="sidebar-link"><span class="icon">🏠</span> Dashboard</a>
      <a href="upload.html" class="sidebar-link active"><span class="icon">⬆️</span> Upload</a>
      <a href="files.html" class="sidebar-link"><span class="icon">📁</span> My Files</a>
      <a href="profile.html" class="sidebar-link"><span class="icon">👤</span> Profile</a>
      <a href="javascript:void(0)" class="sidebar-link" id="logout-btn"><span class="icon">🚪</span> Logout</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button id="menu-toggle" class="btn btn-outline btn-sm menu-toggle-btn">☰</button>
        <div>
          <h1 class="page-title">Upload a File</h1>
          <p class="page-subtitle">Your file will be encrypted with AES-256 + RSA before it ever leaves the server.</p>
        </div>
      </div>
      <button class="theme-toggle-btn" type="button">☀️</button>
    </div>

    <div class="glass-panel" style="padding:32px;max-width:600px;">
      <div class="upload-dropzone" id="dropzone">
        <div class="icon">☁️</div>
        <p><strong>Click to select</strong> or drag and drop a file here</p>
        <p class="text-muted mt-8" style="font-size:12px;">Images, PDF, DOCX, ZIP, video, audio — any file type accepted</p>
        <input type="file" id="file-input" class="hidden" />
      </div>

      <p id="selected-file-name" class="mt-16 hidden" style="font-size:14px;color:var(--blue-light);"></p>

      <div id="upload-progress-wrap" class="hidden">
        <div class="progress-bar"><div class="progress-bar-fill" id="upload-progress-fill"></div></div>
        <p class="text-muted mt-8" id="upload-progress-label" style="font-size:12px;">0%</p>
      </div>

      <button id="upload-btn" class="btn btn-primary btn-block mt-24" disabled>Encrypt & Upload</button>
    </div>
  </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/notification.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/upload.js"></script>
</body>
</html>
