<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("securecrypt_theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}if(t==="light")document.documentElement.setAttribute("data-theme","light");})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — SecureCrypt</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
<div class="auth-bg-glow"></div>
<button class="theme-toggle-btn" type="button" style="position:fixed;top:20px;right:20px;z-index:10;">☀️</button>
<div class="auth-wrapper">
  <div class="glass-panel auth-card">
    <a href="../index.html" class="brand mb-24" style="display:inline-flex;"><img class="brand-icon" src="../images/logo.png" alt="SecureCrypt logo" /> SecureCrypt</a>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to access your encrypted files.</p>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="Your password" required />
      </div>
      <div class="flex-between mb-16">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);">
          <input type="checkbox" id="remember-me" /> Remember me
        </label>
        <a href="forgot-password.html" style="font-size:13px;color:var(--blue-light);">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="register.html">Sign up</a></p>
    <p class="auth-footer"><a href="admin-login.html" style="color:var(--text-muted);">Admin login →</a></p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/notification.js"></script>
<script>redirectIfAuthed();</script>
<script src="../js/auth.js"></script>
</body>
</html>
