<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("securecrypt_theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}if(t==="light")document.documentElement.setAttribute("data-theme","light");})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — SecureCrypt</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar glass-panel">
    <a href="../index.html" class="brand"><img class="brand-icon" src="../images/logo.png" alt="SecureCrypt logo" /> SecureCrypt</a>
    <nav>
      <a href="dashboard.html" class="sidebar-link"><span class="icon">🏠</span> Dashboard</a>
      <a href="upload.html" class="sidebar-link"><span class="icon">⬆️</span> Upload</a>
      <a href="files.html" class="sidebar-link"><span class="icon">📁</span> My Files</a>
      <a href="profile.html" class="sidebar-link active"><span class="icon">👤</span> Profile</a>
      <a href="javascript:void(0)" class="sidebar-link" id="logout-btn"><span class="icon">🚪</span> Logout</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button id="menu-toggle" class="btn btn-outline btn-sm menu-toggle-btn">☰</button>
        <div>
          <h1 class="page-title">Profile Settings</h1>
          <p class="page-subtitle">Manage your account information and security.</p>
        </div>
      </div>
      <button class="theme-toggle-btn" type="button">☀️</button>
    </div>

    <div class="glass-panel" style="padding:32px;max-width:500px;margin-bottom:24px;">
      <h2 class="mb-16" style="font-size:16px;">Account Information</h2>
      <form id="profile-form">
        <div class="form-group">
          <label class="form-label" for="profile-name">Full Name</label>
          <input class="form-input" type="text" id="profile-name" required minlength="2" />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input class="form-input" type="email" id="profile-email" disabled />
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>

    <div class="glass-panel" style="padding:32px;max-width:500px;">
      <h2 class="mb-16" style="font-size:16px;">Change Password</h2>
      <form id="password-form">
        <div class="form-group">
          <label class="form-label" for="current-password">Current Password</label>
          <input class="form-input" type="password" id="current-password" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <input class="form-input" type="password" id="new-password" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>
    </div>
  </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/notification.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script>
  requireAuth();

  async function loadProfile() {
    try {
      const res = await apiFetch('/profile');
      document.getElementById('profile-name').value = res.data.name;
      document.getElementById('profile-email').value = res.data.email;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }
  loadProfile();

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    setButtonLoading(btn, true, 'Saving...');
    try {
      const res = await apiFetch('/profile', {
        method: 'PUT',
        body: { name: document.getElementById('profile-name').value.trim() },
      });
      const stored = getStoredUser() || {};
      stored.name = res.data.name;
      localStorage.setItem(USER_KEY, JSON.stringify(stored));
      showToast('Profile updated.', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      setButtonLoading(btn, false);
    }
  });

  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    setButtonLoading(btn, true, 'Updating...');
    try {
      await apiFetch('/profile/password', {
        method: 'PUT',
        body: {
          currentPassword: document.getElementById('current-password').value,
          newPassword: document.getElementById('new-password').value,
        },
      });
      showToast('Password updated.', 'success');
      e.target.reset();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      setButtonLoading(btn, false);
    }
  });

  document.getElementById('logout-btn')?.addEventListener('click', handleLogout);
</script>
</body>
</html>
